[project]
name = "audit-toolbox"
version = "1.11.3"
description = "审计工具箱：Word 表格 ⇄ Excel 同步、标注同步、空白表格删除与恢复等"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "python-docx==1.2.0",
    "openpyxl==3.1.5",
    "lxml==6.1.1",
    "PySide6-Essentials==6.12.0",
]

[project.optional-dependencies]
exe = ["pyinstaller==6.20.0"]

[tool.uv]
package = false

# 本机直连 PyPI 文件服务器不稳定，默认走清华镜像（公网可用，其他机器复现不受影响）
[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["excel_word/tests"]
addopts = "-q"
python_functions = ["test_*", "t[0-9][0-9]_*"]
