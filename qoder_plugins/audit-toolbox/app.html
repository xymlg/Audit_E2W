<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>审计工具箱</title>
<style>
:root{color-scheme:light;--bg:#f3f5f2;--surface:#fff;--surface-2:#f8faf7;--text:#1d2922;--muted:#657168;--line:#dce3dc;--accent:#245c43;--accent-strong:#17432f;--tint:#e6f0e9;--warning:#936018;--warning-bg:#fff5e3;--danger:#a9322d;--danger-bg:#fff0ee;--success:#2f7650;--shadow:0 10px 30px rgba(26,48,35,.07)}
:root[data-theme="dark"]{color-scheme:dark;--bg:#141a17;--surface:#1c2420;--surface-2:#202a24;--text:#e8efe9;--muted:#a2afa6;--line:#344139;--accent:#9dceb0;--accent-strong:#c2e5cf;--tint:#273a30;--warning:#efbe73;--warning-bg:#382e1e;--danger:#ffb0a9;--danger-bg:#3d2422;--success:#8ed0a8;--shadow:0 10px 30px rgba(0,0,0,.18)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}button:disabled{cursor:not-allowed;opacity:.45}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid color-mix(in srgb,var(--accent) 30%,transparent);outline-offset:2px}[hidden]{display:none!important}.app{min-height:100vh;display:grid;grid-template-rows:auto 1fr auto}.topbar{height:70px;display:flex;align-items:center;justify-content:space-between;gap:20px;padding:0 26px;border-bottom:1px solid var(--line);background:var(--surface)}.brand{display:flex;align-items:center;gap:12px;min-width:0}.brand-mark{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;background:var(--accent);color:var(--surface);flex:none}.brand h1{font-size:18px;line-height:1.2;margin:0;letter-spacing:-.3px}.brand p{margin:3px 0 0;color:var(--muted);font-size:11px}.top-actions{display:flex;align-items:center;gap:10px}.engine-pill{display:flex;align-items:center;gap:8px;padding:7px 11px;border:1px solid var(--line);border-radius:999px;background:var(--surface-2);color:var(--muted);font-size:12px;max-width:360px}.engine-dot{width:8px;height:8px;border-radius:50%;background:#98a39b;flex:none}.engine-pill[data-state="ready"]{color:var(--success)}.engine-pill[data-state="ready"] .engine-dot{background:var(--success)}.engine-pill[data-state="error"]{color:var(--danger)}.engine-pill[data-state="error"] .engine-dot{background:var(--danger)}.workspace{display:grid;grid-template-columns:224px minmax(420px,1fr) 330px;min-height:0}.sidebar{border-right:1px solid var(--line);background:var(--surface);padding:20px 12px;overflow:auto}.nav-group{margin-bottom:18px}.nav-title{margin:0 10px 7px;color:var(--muted);font-size:11px;font-weight:700;letter-spacing:.1em}.nav-button{width:100%;display:flex;align-items:center;gap:10px;border:0;background:transparent;color:var(--text);padding:9px 10px;border-radius:9px;text-align:left}.nav-button:hover{background:var(--surface-2)}.nav-button[aria-current="true"]{background:var(--tint);color:var(--accent);font-weight:700}.nav-icon{width:22px;height:22px;border-radius:6px;display:grid;place-items:center;border:1px solid var(--line);color:var(--muted);font-size:11px;flex:none}.nav-button[aria-current="true"] .nav-icon{border-color:color-mix(in srgb,var(--accent) 30%,var(--line));color:var(--accent)}.main{padding:28px clamp(20px,3vw,38px);min-width:0;overflow:auto}.page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:18px;margin-bottom:22px}.eyebrow{margin:0 0 6px;color:var(--accent);font-size:11px;font-weight:750;letter-spacing:.12em}.page-head h2{margin:0;font-size:27px;line-height:1.2;letter-spacing:-.7px}.page-head p:last-child{margin:8px 0 0;color:var(--muted);max-width:720px}.badge{display:inline-flex;align-items:center;padding:4px 9px;border-radius:999px;background:var(--tint);color:var(--accent);font-size:11px;white-space:nowrap}.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}.form-card{padding:22px}.section-title{display:flex;align-items:center;gap:9px;margin:0 0 16px;font-size:14px}.section-title .step{width:23px;height:23px;border-radius:7px;display:grid;place-items:center;background:var(--tint);color:var(--accent);font-size:10px;font-weight:800}.form-section+.form-section{margin-top:22px;padding-top:20px;border-top:1px solid var(--line)}.field{display:block;margin-top:15px}.field:first-child{margin-top:0}.field-label{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:6px;font-size:12px;font-weight:700}.field-label small{font-weight:400;color:var(--muted)}.path-row{display:flex;gap:8px}.text-input,select,textarea{border:1px solid var(--line);background:var(--surface-2);color:var(--text);border-radius:9px;padding:10px 11px;width:100%;min-width:0}.text-input:disabled{opacity:.55}textarea{min-height:92px;resize:vertical;font-family:ui-monospace,SFMono-Regular,Consolas,"Microsoft YaHei",monospace;font-size:12px}.pick-button,.secondary-button,.quiet-button{border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:9px;padding:9px 12px;white-space:nowrap}.pick-button:hover,.secondary-button:hover,.quiet-button:hover{border-color:var(--accent)}.field-hint{margin:6px 0 0;color:var(--muted);font-size:11px}.check-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.check-row{display:flex;align-items:flex-start;gap:9px;padding:10px 11px;border:1px solid var(--line);border-radius:9px;background:var(--surface-2)}.check-row input{margin-top:3px;accent-color:var(--accent);flex:none}.check-row span{flex:1}.check-row small{display:block;color:var(--muted);margin-top:2px}.inline-fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.inline-fields .field{margin-top:0}.actionbar{display:flex;align-items:center;justify-content:space-between;gap:18px;margin-top:18px}.dry-run{display:flex;align-items:flex-start;gap:8px;color:var(--muted);font-size:12px}.dry-run input{margin-top:3px;accent-color:var(--accent)}.dry-run small{display:block}.primary-button{border:1px solid var(--accent);background:var(--accent);color:var(--surface);border-radius:9px;padding:11px 20px;font-weight:750;min-width:150px}.primary-button:hover:not(:disabled){background:var(--accent-strong);border-color:var(--accent-strong)}.danger-button{border:1px solid var(--danger);background:var(--danger);color:#fff;border-radius:9px;padding:9px 13px;font-weight:700}.confirmation{margin-top:16px;padding:17px;border:1px solid color-mix(in srgb,var(--warning) 45%,var(--line));border-radius:12px;background:var(--warning-bg)}.confirmation h3{margin:0 0 6px;color:var(--warning);font-size:14px}.confirmation p{margin:0;color:var(--muted);font-size:12px;overflow-wrap:anywhere;white-space:pre-line}.confirmation-actions{display:flex;gap:8px;margin-top:13px}.notice{padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2);color:var(--muted);font-size:12px}.task-summary{margin-bottom:14px;padding:12px 14px;border:1px solid var(--line);border-left:3px solid var(--success);border-radius:10px;background:var(--surface-2);font-size:12px}.task-summary[data-review="true"]{border-left-color:var(--warning);background:var(--warning-bg)}.task-summary h4{margin:0 0 8px;font-size:13px}.task-summary p{margin:5px 0;overflow-wrap:anywhere}.task-summary ul{margin:6px 0 0;padding-left:18px}.task-summary li+li{margin-top:4px}.notice strong{color:var(--text)}.result-card{margin-top:18px;overflow:hidden}.result-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line)}.result-head h3{margin:0;font-size:14px}.result-body{padding:16px 18px;max-height:520px;overflow:auto}.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:9px}table{border-collapse:collapse;width:100%;font-size:12px}th,td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}th{background:var(--surface-2);color:var(--muted);font-weight:700;white-space:nowrap}tr:last-child td{border-bottom:0}.choice-list{display:grid;gap:8px}.choice-row{display:flex;align-items:flex-start;gap:9px;padding:10px 11px;border:1px solid var(--line);border-radius:9px;background:var(--surface-2)}.choice-row input{margin-top:3px;accent-color:var(--accent)}.choice-row .choice-text{flex:1;min-width:0}.choice-row small{display:block;color:var(--muted)}.result-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:13px}.mapping-list{display:grid;gap:8px}.mapping-row{display:grid;grid-template-columns:minmax(0,1fr) 130px;gap:8px}.mapping-row .text-input{padding:8px 10px}.empty{color:var(--muted);padding:14px 0}.aside{border-left:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;min-height:0}.task-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:18px;border-bottom:1px solid var(--line)}.task-head h3{margin:0;font-size:14px}.status-badge{font-size:11px;padding:3px 8px;border-radius:999px;background:var(--surface-2);color:var(--muted);white-space:nowrap}.status-badge[data-status="running"],.status-badge[data-status="cancelling"]{color:var(--accent);background:var(--tint)}.status-badge[data-status="succeeded"]{color:var(--success);background:var(--tint)}.status-badge[data-status="failed"]{color:var(--danger);background:var(--danger-bg)}.task-tools{display:flex;gap:7px;padding:10px 18px;border-bottom:1px solid var(--line)}.task-tools button{padding:6px 9px;font-size:11px}.logs{flex:1;min-height:260px;overflow:auto;padding:15px 18px;background:var(--surface-2);font:11px/1.7 ui-monospace,SFMono-Regular,Consolas,"Microsoft YaHei",monospace;white-space:pre-wrap;overflow-wrap:anywhere}.log-empty{color:var(--muted)}.log-line{padding:2px 0}.log-line[data-level="warning"]{color:var(--warning)}.log-line[data-level="error"]{color:var(--danger)}footer{padding:12px 26px;border-top:1px solid var(--line);background:var(--surface);color:var(--muted);font-size:11px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}@media(max-width:1180px){.workspace{grid-template-columns:200px minmax(400px,1fr)}.aside{grid-column:1/-1;border-left:0;border-top:1px solid var(--line);min-height:300px}.logs{max-height:300px}}@media(max-width:760px){.topbar{height:auto;padding:14px 16px;align-items:flex-start}.top-actions{align-items:flex-end;flex-direction:column-reverse}.engine-pill{max-width:230px}.workspace{display:block}.sidebar{border-right:0;border-bottom:1px solid var(--line);padding:12px;display:flex;gap:6px;overflow:auto}.nav-group{margin:0;display:flex;gap:4px}.nav-title{display:none}.nav-button{width:auto;white-space:nowrap;padding:8px}.nav-icon{display:none}.main{padding:20px 16px}.page-head h2{font-size:23px}.form-card{padding:17px}.check-grid,.inline-fields{grid-template-columns:1fr}.actionbar{align-items:stretch;flex-direction:column}.primary-button{width:100%}.mapping-row{grid-template-columns:1fr}.brand p{display:none}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>
</head>
<body>
<main class="app">
<header class="topbar">
  <div class="brand"><span class="brand-mark" aria-hidden="true"><svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M7 3h7l4 4v14H7a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2Z"/><path d="M14 3v5h5M8 12h8M8 16h6"/></svg></span><div><h1>审计工具箱</h1><p>Word ⇄ Excel · 本地处理</p></div></div>
  <div class="top-actions"><button class="quiet-button" id="refresh-engine" type="button">刷新引擎</button><div class="engine-pill" id="engine-pill" data-state="idle" role="status"><span class="engine-dot" aria-hidden="true"></span><span id="engine-text">正在连接本地引擎…</span></div></div>
</header>
<div class="workspace">
  <nav class="sidebar" id="task-nav" aria-label="功能导航"></nav>
  <section class="main">
    <div class="page-head"><div><p class="eyebrow" id="page-group">常用</p><h2 id="page-title">创建 Excel</h2><p id="page-description"></p></div><span class="badge" id="page-badge">本地安全处理</span></div>
    <form class="card form-card" id="operation-form" novalidate>
      <div id="form-fields"></div>
      <div class="actionbar"><label class="dry-run" id="dry-run-label"><input id="dry-run" type="checkbox"><span>仅预演，不写文件<small>先查看差异与警告，确认后再正式执行</small></span></label><button class="primary-button" id="run" type="submit" disabled>开始</button></div>
      <div class="confirmation" id="confirmation" hidden aria-live="polite"><h3 id="confirmation-title">确认执行？</h3><p id="confirmation-text"></p><div class="confirmation-actions"><button class="primary-button" id="confirm-run" type="button">确认并执行</button><button class="secondary-button" id="cancel-confirmation" type="button">返回检查</button></div></div>
    </form>
    <section class="card result-card" id="result-card" hidden aria-live="polite"><div class="result-head"><h3 id="result-title">查询结果</h3><button class="quiet-button" id="clear-result" type="button">收起</button></div><div class="result-body" id="result-body"></div></section>
  </section>
  <aside class="aside">
    <div class="task-head"><h3>执行日志</h3><span class="status-badge" id="task-status" data-status="idle">等待任务</span></div>
    <div class="task-tools"><button class="secondary-button" id="cancel-task" type="button" hidden>取消任务</button><button class="secondary-button" id="clear-logs" type="button">清空显示</button></div>
    <div class="logs" id="logs" role="log" aria-live="polite"><div class="log-empty" id="log-empty">选择左侧任务，按步骤操作。写盘前会显示确认。</div><div id="log-lines"></div></div>
  </aside>
</div>
<footer><span>仅处理你主动选择的本地文件</span><span>不联网 · 不上传报告内容 · 备份默认保留</span></footer>
</main>
<script>/* APP_SCRIPT */</script>
</body>
</html>
